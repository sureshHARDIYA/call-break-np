services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - app_data:/app/data

  # Terminates HTTPS (automatic Let's Encrypt certificate) and proxies HTTP + WebSocket to the app.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. callbreak.example.com or 203.0.113.7.sslip.io}
      # Optional extra hostnames that redirect to DOMAIN. The default is a
      # plain-HTTP placeholder nobody can reach, so no certificate is requested.
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-http://unused.invalid}
    volumes:
      # Mount the folder, not the file: a single-file mount keeps serving the old
      # file after a deploy replaces it.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
